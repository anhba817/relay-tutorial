# Deploy the Building Relay tutorial site.
#
#   docker compose up -d --build
#
# NEXT_PUBLIC_SITE_URL defaults to the production URL below and is baked in at
# BUILD time (metadataBase, sitemap, canonicals, og:url, JSON-LD), so changing
# it requires a rebuild, not just a restart. Override for other environments:
#
#   NEXT_PUBLIC_SITE_URL=http://localhost:3000 docker compose up -d --build

services:
  relay-tutorial:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://relay-tutorial.codewithdongly.io.vn}
    image: relay-tutorial:latest
    container_name: relay-tutorial
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
