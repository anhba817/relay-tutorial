# Deploy the Building Relay tutorial site.
#
#   NEXT_PUBLIC_SITE_URL=https://tutorial.example.com docker compose up -d --build
#
# NEXT_PUBLIC_SITE_URL is baked in at BUILD time (metadataBase / hreflang
# alternates), so changing it requires a rebuild, not just a restart.

services:
  relay-tutorial:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: relay-tutorial:latest
    container_name: relay-tutorial
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
